name: M6D Review
description: Run Codex pull-request reviews, review commands, and thread replies.

inputs:
  mode:
    description: "Event handler to run: review, command, or reply."
    required: true
  review-level:
    description: "Review depth: standard runs one finder pass, thorough runs four focused finders in parallel (five when a REVIEW.md covers the diff). Both are followed by a verifier."
    required: false
    default: standard
  app-id:
    description: GitHub App ID used to submit reviews and start review runs.
    required: true
  app-private-key:
    description: GitHub App private key.
    required: true
  base-branch:
    description: Branch a reviewed pull request must land on; a stacked layer lands where its stack does. Defaults to the repository default branch.
    required: false
    default: ""
  review-workflow:
    description: Workflow filename that @review and final thread resolution re-run or dispatch.
    required: false
    default: review.yml
  waive-roles:
    description: "Comma-separated author associations allowed to close a finding with `@review waive <reason>`, on top of the users listed in CODEOWNERS. Use MEMBER for organisation-owned repositories."
    required: false
    default: OWNER
  notify:
    description: "Comma-separated GitHub logins a pull-request comment mentions when gpt-6.1-sol stays rate limited through three tries and the run fails. Defaults to the users listed in CODEOWNERS."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate action mode
      shell: bash
      env:
        M6D_MODE: ${{ inputs.mode }}
        M6D_EVENT_NAME: ${{ github.event_name }}
        M6D_REVIEW_LEVEL: ${{ inputs.review-level }}
      run: |
        set -euo pipefail
        case "$M6D_MODE:$M6D_EVENT_NAME" in
          review:pull_request|review:workflow_dispatch|command:issue_comment|reply:pull_request_review_comment) ;;
          *)
            echo "::error::Mode $M6D_MODE does not support the $M6D_EVENT_NAME event"
            exit 1
            ;;
        esac
        case "$M6D_REVIEW_LEVEL" in
          standard|thorough) ;;
          *)
            echo "::error::Unknown review level: $M6D_REVIEW_LEVEL"
            exit 1
            ;;
        esac

    # The model steps run the action's code with the Node the runner bundles,
    # so runners need none of their own.
    - name: Find the runner's Node
      id: node
      if: inputs.mode == 'review' || inputs.mode == 'reply'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: core.setOutput("path", process.execPath)

    - name: Create review app token
      id: review-app-token
      if: inputs.mode == 'review'
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        permission-contents: write
        permission-issues: write
        permission-pull-requests: write

    - name: Resolve pull-request context
      id: pr
      if: inputs.mode == 'review'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        M6D_ACTION_PATH: ${{ github.action_path }}
        M6D_PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        M6D_BASE_BRANCH: ${{ inputs.base-branch || github.event.repository.default_branch }}
      with:
        github-token: ${{ steps.review-app-token.outputs.token }}
        script: |
          const review = require(`${process.env.M6D_ACTION_PATH}/dist/review.js`);
          await review.resolve({ github, context, core });

    - name: Check out pull request
      if: inputs.mode == 'review'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ steps.pr.outputs.head_sha }}
        fetch-depth: 0
        persist-credentials: false
        token: ${{ steps.review-app-token.outputs.token }}

    - name: Fetch base branch
      if: inputs.mode == 'review'
      shell: bash
      env:
        BASE_REF: ${{ steps.pr.outputs.base_ref }}
        REVIEW_APP_TOKEN: ${{ steps.review-app-token.outputs.token }}
      run: |
        set -euo pipefail
        basic_auth="$(printf 'x-access-token:%s' "$REVIEW_APP_TOKEN" | base64 | tr -d '\n')"
        git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${basic_auth}" fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"

    - name: Prepare Codex review
      if: inputs.mode == 'review'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        M6D_ACTION_PATH: ${{ github.action_path }}
        M6D_PR_NUMBER: ${{ steps.pr.outputs.number }}
        M6D_PR_TITLE: ${{ steps.pr.outputs.title }}
        M6D_BASE_REF: ${{ steps.pr.outputs.base_ref }}
        M6D_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        M6D_RULES_SHA: ${{ steps.pr.outputs.rules_sha }}
        M6D_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        M6D_APP_SLUG: ${{ steps.review-app-token.outputs.app-slug }}
        M6D_REVIEW_LEVEL: ${{ inputs.review-level }}
      with:
        github-token: ${{ steps.review-app-token.outputs.token }}
        script: |
          const review = require(`${process.env.M6D_ACTION_PATH}/dist/review.js`);
          await review.prepare({ github, context, core });

    # Codex runs from shell steps, never github-script, so no process holding
    # a GitHub token is alive while it reads untrusted pull-request text.
    - name: Run Codex review
      id: codex-review
      if: inputs.mode == 'review'
      shell: bash
      run: '"${{ steps.node.outputs.path }}" "${{ github.action_path }}/dist/model.js" review'
    - name: Check thread decisions
      id: check-threads
      if: inputs.mode == 'review' && steps.codex-review.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        M6D_ACTION_PATH: ${{ github.action_path }}
        M6D_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        M6D_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
      with:
        github-token: ${{ steps.review-app-token.outputs.token }}
        script: |
          const review = require(`${process.env.M6D_ACTION_PATH}/dist/review.js`);
          await review.checkThreads({ github, context, core });

    - name: Retry skipped thread decisions
      id: retry-threads
      if: inputs.mode == 'review' && steps.check-threads.outputs.retry == 'true'
      shell: bash
      run: '"${{ steps.node.outputs.path }}" "${{ github.action_path }}/dist/model.js" threads'
    - name: Submit pull-request review
      id: submit-review
      if: inputs.mode == 'review' && steps.codex-review.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        M6D_ACTION_PATH: ${{ github.action_path }}
        M6D_PR_NUMBER: ${{ steps.pr.outputs.number }}
        M6D_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        M6D_APP_SLUG: ${{ steps.review-app-token.outputs.app-slug }}
      with:
        github-token: ${{ steps.review-app-token.outputs.token }}
        script: |
          const review = require(`${process.env.M6D_ACTION_PATH}/dist/review.js`);
          await review.submit({ github, context, core });

    - name: Mark review as finished
      if: inputs.mode == 'review' && always() && !cancelled() && steps.review-app-token.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        M6D_ACTION_PATH: ${{ github.action_path }}
        M6D_CODEX_OUTCOME: ${{ steps.codex-review.outcome }}
        M6D_REVIEW_OUTCOME: ${{ steps.submit-review.outcome }}
        M6D_REVIEW_EVENT: ${{ steps.submit-review.outputs.review_event }}
        M6D_MERGE_DECISION: ${{ steps.submit-review.outputs.merge_decision }}
        M6D_QUALITY_SCORE: ${{ steps.submit-review.outputs.quality_score }}
        M6D_INLINE_COUNT: ${{ steps.submit-review.outputs.inline_count }}
        M6D_RESOLVED_THREAD_COUNT: ${{ steps.submit-review.outputs.resolved_thread_count }}
        M6D_FAILED_THREAD_COUNT: ${{ steps.submit-review.outputs.failed_thread_resolution_count }}
        M6D_REVIEW_URL: ${{ steps.submit-review.outputs.review_url }}
        M6D_HEAD_SHA: ${{ steps.pr.outputs.head_sha || github.event.pull_request.head.sha }}
        M6D_PR_NUMBER: ${{ steps.pr.outputs.number || github.event.pull_request.number || github.event.inputs.pr_number }}
        M6D_APP_SLUG: ${{ steps.review-app-token.outputs.app-slug }}
      with:
        github-token: ${{ steps.review-app-token.outputs.token }}
        script: |
          const review = require(`${process.env.M6D_ACTION_PATH}/dist/review.js`);
          await review.finish({ github, context, core });

    - name: Fail when merge is not recommended
      if: inputs.mode == 'review' && steps.submit-review.outputs.merge_decision == 'DO_NOT_MERGE'
      shell: bash
      run: exit 1

    - name: Create command app token
      id: command-app-token
      if: inputs.mode == 'command'
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        permission-actions: write
        permission-issues: write
        permission-pull-requests: read

    - name: Start requested review
      if: inputs.mode == 'command'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        M6D_ACTION_PATH: ${{ github.action_path }}
        M6D_REVIEW_WORKFLOW: ${{ inputs.review-workflow }}
      with:
        github-token: ${{ steps.command-app-token.outputs.token }}
        script: |
          const { handleCommand } = require(`${process.env.M6D_ACTION_PATH}/dist/command.js`);
          await handleCommand({ github, context, core });

    - name: Create reply app token
      id: reply-app-token
      if: inputs.mode == 'reply'
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        permission-contents: write
        permission-pull-requests: write
        permission-actions: write

    - name: Validate reply context
      id: reply-context
      if: inputs.mode == 'reply'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        M6D_ACTION_PATH: ${{ github.action_path }}
        M6D_BASE_BRANCH: ${{ inputs.base-branch || github.event.repository.default_branch }}
      with:
        github-token: ${{ steps.reply-app-token.outputs.token }}
        script: |
          const reply = require(`${process.env.M6D_ACTION_PATH}/dist/reply.js`);
          await reply.validate({ github, context, core });

    - name: Check out pull-request head
      if: inputs.mode == 'reply' && steps.reply-context.outputs.skip != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ steps.reply-context.outputs.head_sha }}
        fetch-depth: 0
        persist-credentials: false
        token: ${{ steps.reply-app-token.outputs.token }}

    - name: Fetch reply base branch
      if: inputs.mode == 'reply' && steps.reply-context.outputs.skip != 'true'
      shell: bash
      env:
        BASE_REF: ${{ steps.reply-context.outputs.base_ref }}
        REVIEW_APP_TOKEN: ${{ steps.reply-app-token.outputs.token }}
      run: |
        set -euo pipefail
        basic_auth="$(printf 'x-access-token:%s' "$REVIEW_APP_TOKEN" | base64 | tr -d '\n')"
        git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${basic_auth}" fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"

    - name: Prepare reply evaluation
      id: prepare-reply
      if: inputs.mode == 'reply' && steps.reply-context.outputs.skip != 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        M6D_ACTION_PATH: ${{ github.action_path }}
        M6D_BASE_SHA: ${{ steps.reply-context.outputs.base_sha }}
        M6D_RULES_SHA: ${{ steps.reply-context.outputs.rules_sha }}
        M6D_HEAD_SHA: ${{ steps.reply-context.outputs.head_sha }}
        M6D_WAIVE_ROLES: ${{ inputs.waive-roles }}
      with:
        github-token: ${{ steps.reply-app-token.outputs.token }}
        script: |
          const reply = require(`${process.env.M6D_ACTION_PATH}/dist/reply.js`);
          await reply.prepare({ github, context, core });

    - name: Run Codex reply evaluation
      id: codex-reply
      if: inputs.mode == 'reply' && steps.prepare-reply.outputs.skip != 'true' && steps.prepare-reply.outputs.waiver == ''
      shell: bash
      run: '"${{ steps.node.outputs.path }}" "${{ github.action_path }}/dist/model.js" reply'
    - name: Post review reply
      if: inputs.mode == 'reply' && steps.prepare-reply.outputs.skip != 'true' && (steps.codex-reply.outcome == 'success' || steps.prepare-reply.outputs.waiver != '')
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        M6D_ACTION_PATH: ${{ github.action_path }}
        M6D_ROOT_COMMENT_ID: ${{ steps.prepare-reply.outputs.root_comment_id }}
        M6D_WAIVER: ${{ steps.prepare-reply.outputs.waiver }}
        M6D_ALREADY_REPLIED: ${{ steps.prepare-reply.outputs.already_replied }}
        M6D_BOT_LOGIN: ${{ steps.prepare-reply.outputs.bot_login }}
        M6D_REVIEW_WORKFLOW: ${{ inputs.review-workflow }}
      with:
        github-token: ${{ steps.reply-app-token.outputs.token }}
        script: |
          const reply = require(`${process.env.M6D_ACTION_PATH}/dist/reply.js`);
          await reply.post({ github, context, core });

    - name: Report a rate limit
      if: failure() && (steps.codex-review.outputs.limited || steps.retry-threads.outputs.limited || steps.codex-reply.outputs.limited)
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        M6D_ACTION_PATH: ${{ github.action_path }}
        M6D_LIMITED: ${{ steps.codex-review.outputs.limited || steps.retry-threads.outputs.limited || steps.codex-reply.outputs.limited }}
        M6D_NOTIFY: ${{ inputs.notify }}
        M6D_PR_NUMBER: ${{ steps.pr.outputs.number || github.event.pull_request.number }}
        M6D_HEAD_SHA: ${{ steps.pr.outputs.head_sha || steps.reply-context.outputs.head_sha }}
        M6D_RULES_SHA: ${{ steps.pr.outputs.rules_sha || steps.reply-context.outputs.rules_sha }}
      with:
        github-token: ${{ steps.review-app-token.outputs.token || steps.reply-app-token.outputs.token }}
        script: |
          const { notifyRateLimit } = require(`${process.env.M6D_ACTION_PATH}/dist/model.js`);
          await notifyRateLimit({ github, context, core });

branding:
  icon: eye
  color: purple
